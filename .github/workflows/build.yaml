name: Build Stretch Reminder

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Repository Files
        shell: powershell
        run: |
          Write-Host "Repository Contents:"
          Get-ChildItem -Recurse

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Build Dependencies
        run: |
          pip install pyinstaller

      - name: Verify Python Files
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Include *.py,*.pyw |
          ForEach-Object {
            python -m py_compile $_.FullName
          }

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name StretchReminder `
            stretch_reminder.pyw

      - name: Show Build Output
        shell: powershell
        run: |
          Get-ChildItem dist

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StretchReminder-Windows
          path: dist/StretchReminder.exe
          retention-days: 30
